title: FT Ham — Developer Docs
description: Architecture, implementation guides, and release notes for the FT8/FT4 iOS app.
theme: just-the-docs

remote_theme: just-the-docs/just-the-docs

url: "https://pablots25.github.io"
baseurl: "/ft_ham"

# Navigation order
nav_order_default: desc

# Show last modified time
last_edit_time_format: "%B %e, %Y"

# Search
search_enabled: true
search:
  heading_level: 2
  previews: 3

# Footer
footer_content: "FT Ham &copy; 2025-2026 pablots25. All rights reserved."

# Exclude non-documentation files
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/

# Markdown extensions
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
