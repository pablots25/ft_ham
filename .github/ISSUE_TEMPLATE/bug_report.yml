name: Bug report
description: Something in FT Ham does not work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. The more of the fields below you fill in, the faster it can be fixed.
        Please leave out passwords, API keys and anything you would not post in public.
  - type: input
    id: version
    attributes:
      label: FT Ham version
      description: Settings, About. For example 1.3.2 (28)
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and iOS version
      placeholder: iPhone 15, iOS 26.1
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options:
        - FT8
        - FT4
        - Both
        - Not related to a mode
    validations:
      required: true
  - type: input
    id: radio
    attributes:
      label: Radio and audio interface
      description: How the phone is connected to the radio
      placeholder: IC-705 over a USB-C audio interface, or acoustic coupling
  - type: dropdown
    id: cat
    attributes:
      label: CAT control
      options:
        - Not used
        - rigctld over the network
        - Other
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, and what you expected to see instead
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the Waterfall tab
        2. Tap a signal
        3. ...
    validations:
      required: true
  - type: input
    id: when
    attributes:
      label: When it happened (UTC)
      description: Date and time help match the crash report or logs
      placeholder: 2026-11-11 14:30 UTC
  - type: textarea
    id: attachments
    attributes:
      label: Screenshots or recordings
      description: Drag images or a screen recording here
  - type: checkboxes
    id: checks
    attributes:
      label: Before sending
      options:
        - label: I am on the latest version from the App Store or TestFlight
        - label: I searched the open issues for the same problem
