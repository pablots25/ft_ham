name: Release

# Runs when a release tag is pushed. Tags have no "v" prefix (1.3.2), like
# every tag since 1.2.0. See docs/RELEASING.md for the whole process.
#
# ft8_ham.xcodeproj, Assets.xcassets and GoogleService-Info.plist are not in
# git, so Actions cannot build the app. Builds are archived and uploaded on the
# release Mac with scripts/release.sh. The test and TestFlight jobs below stay
# in place, switched off, and run only when the repository variable
# CI_CAN_BUILD is "true" (once the project can be built from git).
#
# What runs today on a tag:
#   validate        tag matches VERSION, notes pass the style check,
#                   string catalogs have no missing or unfinished translations
#   github-release  creates the GitHub Release, using .github/RELEASE_NOTES.md
#                   from the tagged commit as the body when it names this version
#
# With CI_CAN_BUILD, the test job also runs scripts/benchmark.sh in report-only
# mode and keeps the results as an artifact. The gating benchmark runs in
# scripts/release.sh on the release Mac, where numbers are comparable.
#
# Manual run: Actions, Release, Run workflow. It defaults to a dry run that
# checks everything and prints what it would publish.
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.3.2). The tag must already exist."
        required: true
        type: string
      dry_run:
        description: "Only check and print, do not create the release"
        required: false
        default: true
        type: boolean
      upload_to_testflight:
        description: "Upload to TestFlight (only when CI_CAN_BUILD is true)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write   # create the GitHub Release
  actions: write    # delete this run's artifacts once the release exists

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:

  # ── Job 1: Validate the version, notes and strings ─────────────────────────
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
      tag: ${{ steps.parse.outputs.tag }}

    steps:
      - name: Parse version from tag or input
        id: parse
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            VERSION="${INPUT_VERSION}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version '$VERSION' is not in X.Y.Z format."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing version: $VERSION"

      - name: Checkout the tagged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.parse.outputs.tag }}

      - name: Tag matches VERSION
        env:
          VERSION: ${{ steps.parse.outputs.version }}
        run: |
          set -euo pipefail
          file_version="$(tr -d '[:space:]' < VERSION)"
          if [[ "$file_version" != "$VERSION" ]]; then
            echo "::error file=VERSION::VERSION says '$file_version' but the tag is '$VERSION'. Run scripts/bump_version.sh before tagging."
            exit 1
          fi

      - name: Release notes style
        env:
          VERSION: ${{ steps.parse.outputs.version }}
        run: |
          if python3 scripts/check_release_notes.py "$VERSION" --names-version; then
            python3 scripts/check_release_notes.py "$VERSION"
          else
            echo "::warning::.github/RELEASE_NOTES.md is missing or names another version. The release will use the generated commit list."
          fi

      - name: String catalogs are complete
        run: python3 scripts/check_strings.py --strict

  # ── Job 2: Run unit tests ──────────────────────────────────────────────────
  test:
    name: Unit tests
    needs: validate
    if: vars.CI_CAN_BUILD == 'true'
    runs-on: macos-15
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    defaults:
      run:
        working-directory: ft_ham

    steps:
      # The Xcode project references the premium package as a local sibling
      # (XCLocalSwiftPackageReference "../ft_ham_premium"), so both repos are
      # checked out side by side inside the workspace.
      - name: Checkout ft_ham
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: ft_ham

      - name: Checkout ft_ham_premium
        uses: actions/checkout@v4
        with:
          repository: pablots25/ft_ham_premium
          token: ${{ secrets.PREMIUM_REPO_TOKEN }}
          path: ft_ham_premium

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.3.app

      - name: Setup Ruby
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: ft_ham

      - name: Cache SPM packages
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: spm-${{ hashFiles('ft_ham/ft8_ham.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-

      - name: Run tests
        run: bundle exec fastlane tests

      # Same benchmarks scripts/release.sh runs on the release Mac. Hosted
      # runners vary too much to gate a release, so this only reports.
      - name: Performance benchmarks (report only)
        run: |
          set -euo pipefail
          udid="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          for runtime in sorted(devices, reverse=True):
              for device in devices[runtime]:
                  if device["name"].startswith("iPhone"):
                      print(device["udid"]); sys.exit(0)
          sys.exit(1)')"
          bash scripts/benchmark.sh "$VERSION" "${{ github.run_number }}" \
            --project-root . --simulator "$udid" --report-only

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmarks-${{ env.VERSION }}
          path: ft_ham/benchmarks/*.json
          if-no-files-found: ignore
          retention-days: 90

  # ── Job 3: Build, sign and upload to TestFlight ────────────────────────────
  build-and-upload:
    name: Build & upload to TestFlight
    needs: [validate, test]
    if: vars.CI_CAN_BUILD == 'true'
    runs-on: macos-15
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    defaults:
      run:
        working-directory: ft_ham

    steps:
      - name: Checkout ft_ham
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: ft_ham

      - name: Checkout ft_ham_premium
        uses: actions/checkout@v4
        with:
          repository: pablots25/ft_ham_premium
          token: ${{ secrets.PREMIUM_REPO_TOKEN }}
          path: ft_ham_premium

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.3.app

      - name: Setup Ruby
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: ft_ham

      - name: Cache SPM packages
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: spm-${{ hashFiles('ft_ham/ft8_ham.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-

      # ── Version bump ────────────────────────────────────────────────────────
      - name: Bump version
        run: |
          bash scripts/bump_version.sh "$VERSION" "${{ github.run_number }}"

      # ── Code signing ────────────────────────────────────────────────────────
      - name: Import distribution certificate
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # Decode certificate
          echo "$CERTIFICATE_P12_BASE64" | base64 --decode > /tmp/distribution.p12

          # Create ephemeral keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain

          # Import certificate
          security import /tmp/distribution.p12 \
            -k build.keychain \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/productsign

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain

          rm -f /tmp/distribution.p12

      - name: Install provisioning profile
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > /tmp/profile.mobileprovision
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          UUID=$(security cms -D -i /tmp/profile.mobileprovision | \
            plutil -extract UUID xml1 - -o - | \
            sed -n 's/.*<string>\(.*\)<\/string>.*/\1/p')
          cp /tmp/profile.mobileprovision \
            ~/Library/MobileDevice/Provisioning\ Profiles/"$UUID".mobileprovision
          rm -f /tmp/profile.mobileprovision
          echo "PROVISIONING_PROFILE_NAME=$(security cms -D -i \
            ~/Library/MobileDevice/Provisioning\ Profiles/"$UUID".mobileprovision | \
            plutil -extract Name xml1 - -o - | \
            sed -n 's/.*<string>\(.*\)<\/string>.*/\1/p')" >> "$GITHUB_ENV"

      # ── App Store Connect API key ────────────────────────────────────────────
      - name: Write ASC API key
        env:
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          mkdir -p /tmp/asc
          echo "$APP_STORE_CONNECT_API_KEY_CONTENT" > /tmp/asc/api_key.p8
          # Build a JSON key file that Fastlane's app_store_connect_api_key accepts
          cat > /tmp/asc/key.json <<EOF
          {
            "key_id":     "$APP_STORE_CONNECT_API_KEY_ID",
            "issuer_id":  "$APP_STORE_CONNECT_ISSUER_ID",
            "key":        "$(cat /tmp/asc/api_key.p8 | tr -d '\n')"
          }
          EOF
          echo "APP_STORE_API_KEY_PATH=/tmp/asc/key.json" >> "$GITHUB_ENV"

      # ── Build and upload ─────────────────────────────────────────────────────
      - name: Build & upload to TestFlight
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.upload_to_testflight == 'true' }}
        run: bundle exec fastlane deploy_beta

      - name: Build only (no upload)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.upload_to_testflight == 'false' }}
        run: bundle exec fastlane build_release

      # ── Clean up secrets from disk ──────────────────────────────────────────
      - name: Cleanup secrets
        if: always()
        run: |
          rm -rf /tmp/asc
          security delete-keychain build.keychain 2>/dev/null || true

      # ── Upload IPA as artifact (useful for debugging) ────────────────────────
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ft8_ham-${{ env.VERSION }}-${{ github.run_number }}.ipa
          path: ft_ham/build/ft8_ham.ipa
          retention-days: 14

  # ── Job 4: Create the GitHub Release ──────────────────────────────────────
  github-release:
    name: GitHub Release
    needs: [validate, build-and-upload]
    if: >-
      always() &&
      needs.validate.result == 'success' &&
      (needs.build-and-upload.result == 'success' || needs.build-and-upload.result == 'skipped')
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      TAG: ${{ needs.validate.outputs.tag }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout the tagged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}

      # The hand-written notes live in the tagged commit. They replace the
      # generated commit list only when their heading names this version, so a
      # file left over from the previous release is never published by mistake.
      - name: Choose release notes
        id: notes
        run: |
          set -euo pipefail
          if python3 scripts/check_release_notes.py "$VERSION" --names-version; then
            echo "file=.github/RELEASE_NOTES.md" >> "$GITHUB_OUTPUT"
            echo "Using .github/RELEASE_NOTES.md"
          else
            echo "file=" >> "$GITHUB_OUTPUT"
            echo "Using the generated notes"
          fi

      - name: Create or update the release
        env:
          NOTES_FILE: ${{ steps.notes.outputs.file }}
        run: |
          set -euo pipefail
          if [[ "$DRY_RUN" == "true" ]]; then
            echo "Dry run. Would publish release '$TAG' titled 'Version $VERSION'."
            if [[ -n "$NOTES_FILE" ]]; then cat "$NOTES_FILE"; fi
            exit 0
          fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists, updating its notes."
          else
            gh release create "$TAG" \
              --verify-tag \
              --title "Version $VERSION" \
              --generate-notes \
              --latest
          fi
          if [[ -n "$NOTES_FILE" ]]; then
            gh release edit "$TAG" --notes-file "$NOTES_FILE"
          fi

      - name: Delete this run's artifacts
        if: success() && env.DRY_RUN != 'true'
        run: |
          set -euo pipefail
          ids=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --jq '.artifacts[].id')
          for id in $ids; do
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}"
            echo "Deleted artifact ${id}"
          done

  # ── Job 5: Dispatch tag to ft_ham_premium ─────────────────────────────────
  sync-premium:
    name: Sync tag to ft_ham_premium
    # scripts/release.sh tags ft_ham_premium locally. This dispatch runs only
    # when the repository variable PREMIUM_DISPATCH is "true" and the premium
    # repository has a workflow listening for "new-release".
    needs: [validate, github-release]
    if: vars.PREMIUM_DISPATCH == 'true' && needs.github-release.result == 'success'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.validate.outputs.version }}

    steps:
      - name: Dispatch release event to ft_ham_premium
        uses: peter-evans/repository-dispatch@ff45666b9427631e3450c54a1bcbee4d9ff4d7c0 # v3.0.0
        with:
          token: ${{ secrets.PREMIUM_REPO_TOKEN }}
          repository: pablots25/ft_ham_premium
          event-type: new-release
          client-payload: '{"version": "${{ env.VERSION }}", "source_sha": "${{ github.sha }}"}'

  # ── Job 6: Publish docs to GitHub Pages ───────────────────────────────────
  publish-docs:
    name: Publish docs to GitHub Pages
    # Most of docs/ is local only (*.md is ignored), so this is off unless the
    # repository variable PUBLISH_DOCS is "true".
    needs: [validate, github-release]
    if: vars.PUBLISH_DOCS == 'true' && needs.github-release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    env:
      VERSION: ${{ needs.validate.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build Pages artifact from docs/
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
