name: Release

# ─── Triggers ────────────────────────────────────────────────────────────────
# • Push a semver tag (v1.2.7, v1.3.0, etc.) for a normal release.
# • Use workflow_dispatch for manual/hotfix releases.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.3.0)"
        required: true
        type: string
      upload_to_testflight:
        description: "Upload to TestFlight?"
        required: false
        default: true
        type: boolean

# ─── Global permissions ───────────────────────────────────────────────────────
permissions:
  contents: write   # needed to create GitHub Releases and push gh-pages
  pages: write
  id-token: write

# ─── Concurrency ──────────────────────────────────────────────────────────────
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:

  # ── Job 1: Parse and validate the version ─────────────────────────────────
  validate:
    name: Validate version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}

    steps:
      - name: Parse version from tag or input
        id: parse
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            # Strip the leading "v" from the tag
            VERSION="${GITHUB_REF_NAME#v}"
          fi

          # Validate X.Y.Z format
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Version '$VERSION' is not in X.Y.Z format."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing version: $VERSION"

  # ── Job 2: Run unit tests ──────────────────────────────────────────────────
  test:
    name: Unit tests
    needs: validate
    runs-on: macos-15
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    defaults:
      run:
        working-directory: ft_ham

    steps:
      # The Xcode project references the premium package as a local sibling
      # (XCLocalSwiftPackageReference "../ft_ham_premium"), so both repos are
      # checked out side by side inside the workspace.
      - name: Checkout ft_ham
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: ft_ham

      - name: Checkout ft_ham_premium
        uses: actions/checkout@v4
        with:
          repository: pablots25/ft_ham_premium
          token: ${{ secrets.PREMIUM_REPO_TOKEN }}
          path: ft_ham_premium

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.3.app

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: ft_ham

      - name: Cache SPM packages
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: spm-${{ hashFiles('ft_ham/ft8_ham.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-

      - name: Run tests
        run: bundle exec fastlane tests

  # ── Job 3: Build, sign and upload to TestFlight ────────────────────────────
  build-and-upload:
    name: Build & upload to TestFlight
    needs: [validate, test]
    runs-on: macos-15
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    defaults:
      run:
        working-directory: ft_ham

    steps:
      - name: Checkout ft_ham
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: ft_ham

      - name: Checkout ft_ham_premium
        uses: actions/checkout@v4
        with:
          repository: pablots25/ft_ham_premium
          token: ${{ secrets.PREMIUM_REPO_TOKEN }}
          path: ft_ham_premium

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.3.app

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: ft_ham

      - name: Cache SPM packages
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: spm-${{ hashFiles('ft_ham/ft8_ham.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-

      # ── Version bump ────────────────────────────────────────────────────────
      - name: Bump version
        run: |
          bash scripts/bump_version.sh "$VERSION" "${{ github.run_number }}"

      # ── Code signing ────────────────────────────────────────────────────────
      - name: Import distribution certificate
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # Decode certificate
          echo "$CERTIFICATE_P12_BASE64" | base64 --decode > /tmp/distribution.p12

          # Create ephemeral keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain

          # Import certificate
          security import /tmp/distribution.p12 \
            -k build.keychain \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/productsign

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain

          rm -f /tmp/distribution.p12

      - name: Install provisioning profile
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > /tmp/profile.mobileprovision
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          UUID=$(security cms -D -i /tmp/profile.mobileprovision | \
            plutil -extract UUID xml1 - -o - | \
            sed -n 's/.*<string>\(.*\)<\/string>.*/\1/p')
          cp /tmp/profile.mobileprovision \
            ~/Library/MobileDevice/Provisioning\ Profiles/"$UUID".mobileprovision
          rm -f /tmp/profile.mobileprovision
          echo "PROVISIONING_PROFILE_NAME=$(security cms -D -i \
            ~/Library/MobileDevice/Provisioning\ Profiles/"$UUID".mobileprovision | \
            plutil -extract Name xml1 - -o - | \
            sed -n 's/.*<string>\(.*\)<\/string>.*/\1/p')" >> "$GITHUB_ENV"

      # ── App Store Connect API key ────────────────────────────────────────────
      - name: Write ASC API key
        env:
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
        run: |
          mkdir -p /tmp/asc
          echo "$APP_STORE_CONNECT_API_KEY_CONTENT" > /tmp/asc/api_key.p8
          # Build a JSON key file that Fastlane's app_store_connect_api_key accepts
          cat > /tmp/asc/key.json <<EOF
          {
            "key_id":     "${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}",
            "issuer_id":  "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}",
            "key":        "$(cat /tmp/asc/api_key.p8 | tr -d '\n')"
          }
          EOF
          echo "APP_STORE_API_KEY_PATH=/tmp/asc/key.json" >> "$GITHUB_ENV"

      # ── Build and upload ─────────────────────────────────────────────────────
      - name: Build & upload to TestFlight
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.upload_to_testflight == 'true' }}
        run: bundle exec fastlane deploy_beta

      - name: Build only (no upload)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.upload_to_testflight == 'false' }}
        run: bundle exec fastlane build_release

      # ── Clean up secrets from disk ──────────────────────────────────────────
      - name: Cleanup secrets
        if: always()
        run: |
          rm -rf /tmp/asc
          security delete-keychain build.keychain 2>/dev/null || true

      # ── Upload IPA as artifact (useful for debugging) ────────────────────────
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ft8_ham-${{ env.VERSION }}-${{ github.run_number }}.ipa
          path: ft_ham/build/ft8_ham.ipa
          retention-days: 14

  # ── Job 4: Create GitHub Release ──────────────────────────────────────────
  github-release:
    name: Create GitHub Release
    needs: [validate, build-and-upload]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        run: |
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --generate-notes \
            --draft=false \
            --latest

  # ── Job 5: Dispatch tag to ft_ham_premium ─────────────────────────────────
  sync-premium:
    name: Sync tag to ft_ham_premium
    needs: [validate, build-and-upload]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.validate.outputs.version }}

    steps:
      - name: Dispatch release event to ft_ham_premium
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.PREMIUM_REPO_TOKEN }}
          repository: pablots25/ft_ham_premium
          event-type: new-release
          client-payload: '{"version": "${{ env.VERSION }}", "build": "${{ github.run_number }}", "source_sha": "${{ github.sha }}"}'

  # ── Job 6: Publish docs to GitHub Pages ───────────────────────────────────
  publish-docs:
    name: Publish docs to GitHub Pages
    needs: [validate, build-and-upload]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.validate.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build Pages artifact from docs/
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
